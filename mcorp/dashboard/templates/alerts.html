{% extends "base.html" %}{% block content %}<h1>Alertes</h1><div class="alerts">{% for alert in alerts %}<article class="alert {{ alert.severity|lower }}"><strong>{{ alert.severity }} · {{ alert.kind }}</strong><p>{{ alert.message }}</p></article>{% else %}<article class="alert ok"><strong>Aucune anomalie détectée</strong></article>{% endfor %}</div>{% endblock %}
